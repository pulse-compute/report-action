name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: report-action-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: npm test
  compare-shim:
    name: Validate temporary beta.10 comparison shim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: npm ci --prefix validation --ignore-scripts --no-audit --no-fund
      - run: npm run test:shim
      - name: Generate validation-only comparison bundle
        run: |
          mkdir -p validation/.output
          npm run validate:compare -- --allow-internal-beta10 validation/fixtures/before.json validation/fixtures/after.json validation/.output/hosted
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare-shim-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/.output/hosted/compare.json
            validation/.output/hosted/compare.html
            validation/.output/hosted/compare-shim-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
